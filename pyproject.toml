[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fuelgauge"
version = "0.2.0"
description = "Personal AI-subscription quota viewer (Codex + Claude); source for reference, not published to PyPI."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Jason" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
tray = [
    "pystray>=0.19",
    "Pillow>=9.0",
    "winotify>=1.1; platform_system=='Windows'",
    "plyer>=2.1; platform_system!='Windows'",
]

[project.urls]
Homepage = "https://github.com/k7631159/ai-fuelgauge"
Issues = "https://github.com/k7631159/ai-fuelgauge/issues"

[project.scripts]
ai-fuelgauge = "ai_fuelgauge:main_entry"

# Single-file layout: modules are at the repo root.
[tool.setuptools]
py-modules = ["ai_fuelgauge", "tray", "hud", "windows_detach"]
